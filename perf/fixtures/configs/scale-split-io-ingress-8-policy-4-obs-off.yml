# Ad-hoc remeasure cell — split_io ingress step (8 / 4 / 2).
# Policy and I/O fixed; listeners.threads: 8. Lab-only (uncurated).
schema_version: 1
dataplane:
  runtime: split_io
  policy_workers: 4
  io_workers: 2
listeners:
  rcvbuf: 4194304  # 4 MiB; needs net.core.rmem_max >= this
  threads: 8
  reuse_port: true
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: perf-udp
forward:
  outstanding_per_backend: 8192
  timeout_ms: 5000
orchestrator:
  max_attempts: 2
  max_txn_duration_ms: 8000
  txn_table_capacity: 65536
events:
  queue_depth: 4096
  drop_policy: drop_oldest
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
        weight: 100
rules:
  match_mode: first_match
  rules:
    - name: default-pool
      hook: request
      selectors: []
      actions:
        - type: set_pool
          value: default
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: false
metrics:
  enabled: false
logging:
  level: warn
