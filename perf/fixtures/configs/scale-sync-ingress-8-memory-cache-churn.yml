# High-churn — sync with eight ingress workers + memory cache.
# Matched with scale-sync-ingress-8-lmdb-cache-churn (same max_entries, query mix, TTL, workers).
# Primary study pair for memory-vs-lmdb-cache-churn (enough concurrency for a fair backend compare).
schema_version: 1
listeners:
  rcvbuf: 4194304  # 4 MiB; needs net.core.rmem_max >= this
  threads: 8
  reuse_port: true
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: perf-udp
forward:
  outstanding_per_backend: 8192
  timeout_ms: 2000
orchestrator:
  max_attempts: 2
  max_txn_duration_ms: 5000
  txn_table_capacity: 65536
events:
  queue_depth: 4096
  drop_policy: drop_oldest
caches:
  - name: global
    type: memory
    max_entries: 2048
    negative_cache:
      enabled: true
lookup:
  profiles:
    default:
      providers:
        - type: cache
          cache: global
        - type: forward
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
        weight: 100
rules:
  match_mode: first_match
  rules:
    - name: default-pool
      hook: request
      selectors: []
      actions:
        - type: set_pool
          value: default
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: false
metrics:
  enabled: true
  base: standard
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
logging:
  level: warn
