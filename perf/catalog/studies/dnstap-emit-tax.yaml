schema_version: 1
id: dnstap-emit-tax
title: Dnstap emit tax
question: What does sampled vs fuller dnstap emission cost versus dnstap off?
published: true
members:
  - feature-tax-dnstap-off-forward-fast
  - feature-tax-dnstap-sampled-forward-fast
  - feature-tax-dnstap-full-forward-fast
compare_axis: obs_posture
primary_metric: achieved_qps
takeaway: >
  Versus dnstap off (~75k), sampled emit costs about 4% QPS (~72k) and full
  emit about 11% (~67k). Prefer sampled until you need fuller capture.
