schema_version: 1
id: memory-vs-lmdb-cache-churn
title: Memory vs LMDB high-churn cache
question: >
  Under a matched high-churn recipe with enough sync ingress concurrency for
  both backends to do useful parallel work, how do memory and LMDB answer
  caches differ in achieved QPS and cache hit/miss ratios?
published: true
members:
  - scale-sync-ingress-8-memory-cache-churn
  - scale-sync-ingress-8-lmdb-cache-churn
compare_axis: cache_backend
primary_metric: achieved_qps
takeaway: >
  Under matched ingress-8 high churn (fixed safe sync; LMDB shard_count 16),
  LMDB costs about 99% QPS versus memory on this lab (~3k vs ~268k) — roughly
  93.4× slower. That contrasts with warm cache_hit, where LMDB costs only about
  6%. Hit rates stay in the same band (about 6% relative); mean fill is about
  3.0 ms for LMDB versus about 0.0005 ms for memory under continuous turnover.
  Average latency under the elevated outstanding window tracks roughly
  outstanding/QPS and is not raw disk service time. Lazy TTL expiry is
  deterministic; LMDB when_full victim selection is arbitrary under entry
  pressure. Absolute LMDB churn QPS is disk and sync-mode sensitive; prefer the
  relative claim. Thin-ingress companion cells are not this study’s primary
  compare.
