takeaway: >
  Raising ingress/policy/I/O together (4/4/4 vs thin 2/2/2) reaches about
  1.5× QPS on this median (~210k vs ~141k). Still size one dial at a time —
  this bulk pair is not a substitute for single-axis studies.
