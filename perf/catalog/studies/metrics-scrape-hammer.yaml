schema_version: 1
id: metrics-scrape-hammer
title: Aggressive scrape cadence under load
question: What does frequent Prometheus scraping during load cost versus listener-only scrape?
published: true
members:
  - feature-tax-metrics-off-forward-fast
  - feature-tax-metrics-standard-scrape-forward-fast
  - feature-tax-metrics-standard-scrape-hammer-forward-fast
compare_axis: obs_posture
primary_metric: achieved_qps
takeaway: >
  Listener-only standard scrape costs about 11% QPS versus obs-off; an aggressive
  lab scraper (~10/s) lands in the same band — size scrape tax from the ladder,
  not from scrape interval alone.
