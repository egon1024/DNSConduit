id: metrics-collect-vs-emit
title: Metrics collect vs emit
question: Is metrics cost dominated by hot-path collect, or by scrape emit?
published: true
members:
  - feature-tax-metrics-no-collect-forward-fast
  - feature-tax-metrics-collect-only-forward-fast
  - feature-tax-metrics-collect-emit-forward-fast
compare_axis: obs_posture
primary_metric: achieved_qps
takeaway: >
  Versus no-collect (~68k): collect-only within about 3% (~70k); collect+emit
  about 6–8% (~64k). Most standing cost is still collect, with export adding a
  band.
