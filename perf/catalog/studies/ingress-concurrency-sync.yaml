schema_version: 1
id: ingress-concurrency-sync
title: Ingress concurrency under sync
question: How many sync ingress workers buy throughput before the curve flattens?
published: true
members:
  - scale-sync-ingress-1-forward-fast
  - scale-sync-forward-fast
  - scale-sync-ingress-4-forward-fast
