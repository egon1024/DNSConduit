  - scale-sync-ingress-4-forward-slow
  - scale-sync-ingress-8-forward-slow
compare_axis: ingress_workers
primary_metric: achieved_qps
takeaway: >
  More sync ingress threads raise forward_fast throughput on this lab (~39k →
  76k → 135k → 206k at 1/2/4/8). Under forward_slow, completed QPS scales but
  stays tiny and lossy — prefer split_io when upstream wait owns the path.
