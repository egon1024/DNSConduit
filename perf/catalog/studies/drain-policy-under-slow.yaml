schema_version: 1
id: drain-policy-under-slow
title: Drain policy under slow upstream
question: How do complete, budgeted, and minimal drain policies behave under forward_slow load?
published: true
members:
  - shutdown-drain-complete-forward-slow
  - shutdown-drain-budgeted-forward-slow
  - shutdown-drain-minimal-forward-slow
compare_axis: drain_policy
primary_metric: drain_duration_ms
takeaway: >
  On the published forward_slow cells (median of three rounds), minimal drain
  finishes fastest (~63 ms); complete and budgeted both take ~114 ms. Complete
  records the most client failures during stop — pick deliberately for your
  upgrade window.
