schema_version: 1
id: sync-vs-split-io
title: Sync vs split_io under paired load shapes
question: When does split_io beat sync for forwarding throughput and latency?
published: true
members:
  - scale-sync-forward-fast
  - scale-split-io-forward-fast
  - scale-sync-forward-slow
  - scale-split-io-forward-slow
compare_axis: runtime
primary_metric: achieved_qps
takeaway: >
  Under forward_fast, split_io reaches about 1.8× sync QPS (~139k vs ~76k).
  Under forward_slow, split_io still completes far more (~39k vs sync ~6 QPS
  lossy) — prefer split_io when upstream wait owns the path.
related_guides:
  - /guides/dataplane-runtime-tuning.md
