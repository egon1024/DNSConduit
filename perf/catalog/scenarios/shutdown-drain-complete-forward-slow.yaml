schema_version: 1
id: shutdown-drain-complete-forward-slow
suite: shutdown_drain
curated: true
summary: |
  Stop under load with a long drain timeout budget (drain-complete) while forwarding to a slow stub upstream. Records drain duration and client loss during the stop window.
notes: |
  Paired with drain-budgeted and drain-minimal for relative comparison.
axes:
  runtime: sync
  load_shape: forward_slow
  drain_policy: drain_complete
  ingress_workers: 2
recipe:
  config: shutdown-drain-complete-forward-slow.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  shutdown: true
  stop_wait_s: 12
  load_time_s: 12
  min_answer_ok_percent: 0
