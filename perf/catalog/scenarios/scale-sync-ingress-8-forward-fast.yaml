schema_version: 1
id: scale-sync-ingress-8-forward-fast
suite: scale
curated: true
summary: |
  Sync runtime with eight ingress workers under a fast stub upstream.
notes: |
  Elevated dnsperf outstanding window so QPS reflects ingress capacity. Part of the ingress concurrency series (1/2/4/8).
axes:
  runtime: sync
  load_shape: forward_fast
  ingress_workers: 8
recipe:
  config: scale-sync-ingress-8-obs-off.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
