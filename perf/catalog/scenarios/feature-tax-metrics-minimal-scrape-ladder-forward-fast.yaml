schema_version: 1
id: feature-tax-metrics-minimal-scrape-ladder-forward-fast
suite: feature_tax
curated: true
summary: |
  Same minimal metrics scrape posture as the standard minimal-scrape cell, run with a larger dnsperf in-flight window so the scrape cost series is not limited by the load generator.
notes: |
  Published recipe for the metrics scrape cost series; pair with the off and standard cells that share this elevated outstanding window.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_minimal_scrape
  ingress_workers: 2
  loadgen_recipe: elevated_outstanding
recipe:
  config: feature-tax-metrics-minimal-scrape.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
