schema_version: 1
id: scale-sync-ingress-1-forward-fast
suite: scale
curated: true
summary: |
  Sync runtime with one ingress worker under a fast stub upstream.
notes: |
  Uses an elevated dnsperf outstanding window so achieved QPS reflects Conduit ingress capacity rather than the load generator. Part of the ingress concurrency series (1/2/4/8).
axes:
  runtime: sync
  load_shape: forward_fast
  ingress_workers: 1
recipe:
  config: scale-sync-ingress-1-obs-off.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
