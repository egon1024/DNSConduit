schema_version: 1
id: scale-sync-ingress-1-forward-fast
suite: scale
curated: true
intent: |
  Ingress-concurrency ladder (sync): one ingress worker under forward_fast.
  Published forward_fast recipe (elevated outstanding) so achieved QPS reflects
  Conduit ingress capacity rather than the loadgen outstanding window.
axes:
  runtime: sync
  load_shape: forward_fast
  ingress_workers: 1
recipe:
  config: scale-sync-ingress-1-obs-off.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
