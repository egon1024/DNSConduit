schema_version: 1
id: feature-tax-metrics-otlp-push-forward-fast
suite: feature_tax
curated: true
summary: |
  Measures the cost of pushing metrics over OTLP HTTP while forwarding to a fast stub upstream.
notes: |
  Requires conduit-otlp-metrics-tracer. The lab receiver also records otlp_accepts / otlp_failures as secondary signals.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_otlp_push
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-otlp-push.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  otlp_receiver: true
  skip_unless: otlp_tracer
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
