schema_version: 1
id: scale-split-io-forward-fast
suite: scale
curated: true
summary: |
  Throughput for the split_io runtime while forwarding to a fast stub upstream.
notes: |
  Thin published pair with scale-sync-forward-fast.
axes:
  runtime: split_io
  load_shape: forward_fast
  topology: thin
  ingress_workers: 2
  policy_workers: 2
  io_workers: 2
recipe:
  config: scale-split-io-obs-off.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
