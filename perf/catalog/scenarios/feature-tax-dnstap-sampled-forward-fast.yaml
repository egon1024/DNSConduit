schema_version: 1
id: feature-tax-dnstap-sampled-forward-fast
suite: feature_tax
curated: true
summary: |
  Measures dnstap cost when only about 10% of response frames are emitted to a lab receiver, still under a fast stub upstream.
notes: |
  Middle cell between dnstap-off and full dnstap emit. Requires the lab dnstap tracer.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: dnstap_sampled
  ingress_workers: 2
recipe:
  config: feature-tax-dnstap-sampled.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  dnstap_receiver: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
