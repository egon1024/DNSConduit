schema_version: 1
id: feature-tax-metrics-standard-scrape-forward-fast
suite: feature_tax
curated: true
summary: |
  Prometheus scrape with the standard metrics base (collect and emit) while forwarding to a fast stub upstream.
notes: |
  High end of the scrape cost series; also the collect+emit pole in collect comparisons that reuse this cell.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_standard_scrape
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-standard-scrape.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
