schema_version: 1
id: feature-tax-metrics-collect-only-forward-fast
suite: feature_tax
curated: true
summary: |
  Records hot-path metrics in process but does not scrape or push them (collect on, emit off) under a fast stub upstream.
notes: |
  Paired with collect+emit and no-collect.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_collect_only
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-collect-only.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
