schema_version: 1
id: scale-sync-lmdb-cache-hit
suite: scale
curated: true
summary: |
  Warm LMDB cache hits on the sync runtime using a real-disk environment path. After warm-up the load is read-mostly (near-100% hits).
notes: |
  Uses the fixed safe LMDB sync durability default. Not a high-churn fill/evict shape. Compare with scale-sync-cache-hit via the memory-vs-lmdb-cache-hit study.
axes:
  runtime: sync
  load_shape: cache_hit
  ingress_workers: 2
  cache_backend: lmdb
recipe:
  config: scale-sync-lmdb-cache-hit.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  cache_warm: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
