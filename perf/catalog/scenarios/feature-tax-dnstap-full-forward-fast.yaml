schema_version: 1
id: feature-tax-dnstap-full-forward-fast
suite: feature_tax
curated: true
summary: |
  Measures how much throughput changes when Conduit emits full dnstap event frames (query, response, and retry) to a lab receiver while forwarding to a fast stub upstream.
notes: |
  Part of the dnstap cost series with dnstap-off and dnstap-sampled. Requires the lab dnstap tracer.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: dnstap_full
  ingress_workers: 2
recipe:
  config: feature-tax-dnstap-full.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  dnstap_receiver: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
