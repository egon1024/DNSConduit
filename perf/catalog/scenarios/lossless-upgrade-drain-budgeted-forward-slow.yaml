schema_version: 1
id: lossless-upgrade-drain-budgeted-forward-slow
suite: lossless_upgrade
curated: false
intent: |
  Zero-downtime upgrade handoff under forward_slow with drain-budgeted policy.
  Records upgrade gap/loss, child READY time, and drain duration when the binary
  supports lossless upgrade. Skipped until zero-downtime upgrade is available
  (pass --zdu to the runner when testing a ZDU-capable binary).
axes:
  runtime: sync
  load_shape: forward_slow
  drain_policy: drain_budgeted
  ingress_workers: 2
recipe:
  config: scale-sync-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  skip_unless: zdu
