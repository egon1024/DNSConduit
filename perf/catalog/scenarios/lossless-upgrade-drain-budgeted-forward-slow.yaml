schema_version: 1
id: lossless-upgrade-drain-budgeted-forward-slow
suite: lossless_upgrade
curated: false
summary: |
  Zero-downtime upgrade handoff under a slow stub upstream with a drain-budgeted stop policy. Records upgrade gap or loss, child READY time, and drain duration when the binary supports lossless upgrade.
notes: |
  Skipped until zero-downtime upgrade is available (pass --zdu when testing a ZDU-capable binary).
axes:
  runtime: sync
  load_shape: forward_slow
  drain_policy: drain_budgeted
  ingress_workers: 2
recipe:
  config: scale-sync-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  skip_unless: zdu
  min_answer_ok_percent: 0
