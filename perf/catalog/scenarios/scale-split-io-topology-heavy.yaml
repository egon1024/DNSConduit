schema_version: 1
id: scale-split-io-topology-heavy
suite: scale
curated: true
summary: |
  Higher worker counts on split_io (ingress, policy, and I/O at four each) under a fast stub upstream — a threads-versus-cores topology check.
notes: |
  Runnable locally; not required in the published reference set.
axes:
  runtime: split_io
  load_shape: forward_fast
  topology: heavy
  ingress_workers: 4
  policy_workers: 4
  io_workers: 4
recipe:
  config: scale-split-io-topology-heavy.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
