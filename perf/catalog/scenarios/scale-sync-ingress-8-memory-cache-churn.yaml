schema_version: 1
id: scale-sync-ingress-8-memory-cache-churn
suite: scale
curated: true
summary: |
  High-churn memory-cache load on sync with eight ingress workers: query set larger than max_entries, stub TTL long enough that entry-cap turnover drives misses, no warm plateau.
notes: |
  Primary memory member of study memory-vs-lmdb-cache-churn. Matched with the three first-class LMDB sync-mode cells (full / no_meta / none) at eight ingress workers. Recipe: 4096 unique names, max_entries 2048, stub TTL 60s. The thin-ingress pair (scale-sync-memory-cache-churn) remains as a companion cell, not the study primary.
axes:
  runtime: sync
  load_shape: cache_churn
  ingress_workers: 8
  cache_backend: memory
  lmdb_sync: memory
recipe:
  config: scale-sync-ingress-8-memory-cache-churn.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-churn-a.txt
  cache_warm: false
  upstream_ttl_secs: 60
  record_cache_metrics: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
