schema_version: 1
id: scale-sync-ingress-8-forward-slow
suite: scale
curated: true
intent: |
  Ingress concurrency (sync): eight ingress workers under forward_slow.
  Optional noisy rung — keep in catalog; publish may omit if unstable on the lab.
axes:
  runtime: sync
  load_shape: forward_slow
  ingress_workers: 8
recipe:
  config: scale-sync-ingress-8-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
  # Blocking runtimes complete very few queries against a 50 ms upstream;
  # a longer window keeps the sample large enough to mean something.
  duration_s: 30
