schema_version: 1
id: feature-tax-metrics-standard-dnstap-full-forward-fast
suite: feature_tax
curated: true
summary: |
  Combined observability cost: standard Prometheus scrape plus full dnstap emit under a fast stub upstream.
notes: |
  Used in studies that stack scrape and dnstap together.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_standard_dnstap_full
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-standard-dnstap-full.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  dnstap_receiver: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
