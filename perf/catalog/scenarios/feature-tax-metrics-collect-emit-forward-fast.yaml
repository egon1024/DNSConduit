schema_version: 1
id: feature-tax-metrics-collect-emit-forward-fast
suite: feature_tax
curated: true
summary: |
  Records hot-path metrics and exports them (collect and emit) under a fast stub upstream, using the standard metrics base.
notes: |
  Paired with collect-only and no-collect for the collect-versus-emit comparison.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_collect_emit
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-collect-emit.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
