schema_version: 1
id: scale-sync-memory-cache-churn
suite: scale
curated: true
summary: |
  High-churn memory-cache load on the sync runtime: a query set larger than max_entries, a long enough stub TTL that entry-cap turnover (not TTL expiry alone) drives misses, and no warm plateau before dnsperf.
notes: |
  Matched with scale-sync-lmdb-cache-churn for study memory-vs-lmdb-cache-churn. Not the warm cache_hit pole. Recipe: 4096 unique names, max_entries 2048, stub TTL 60s — steady sequential cycling yields roughly half hits from the entry cap when TTL does not expire first. Lazy TTL expiry is deterministic; hit-rate noise under pressure is from capacity turnover / when_full victims, not a random clock.
axes:
  runtime: sync
  load_shape: cache_churn
  ingress_workers: 2
  cache_backend: memory
recipe:
  config: scale-sync-memory-cache-churn.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-churn-a.txt
  cache_warm: false
  upstream_ttl_secs: 60
  record_cache_metrics: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
