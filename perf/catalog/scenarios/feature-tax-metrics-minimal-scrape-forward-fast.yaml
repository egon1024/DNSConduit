schema_version: 1
id: feature-tax-metrics-minimal-scrape-forward-fast
suite: feature_tax
curated: true
summary: |
  Prometheus scrape with the minimal metrics base (collect and emit) while forwarding to a fast stub upstream.
notes: |
  Middle cell between metrics-off and standard scrape.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_minimal_scrape
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-minimal-scrape.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
