schema_version: 1
id: scale-sync-forward-slow
suite: scale
curated: true
summary: |
  Throughput for the sync runtime while every upstream answer is held for 50 ms (forward_slow).
notes: |
  Paired with scale-split-io-forward-slow for relative comparison.
axes:
  runtime: sync
  load_shape: forward_slow
  ingress_workers: 2
recipe:
  config: scale-sync-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
  duration_s: 30
