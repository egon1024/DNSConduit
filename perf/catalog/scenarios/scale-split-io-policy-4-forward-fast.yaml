schema_version: 1
id: scale-split-io-policy-4-forward-fast
suite: scale
curated: false
summary: |
  split_io under a fast stub upstream with the same thin ingress and I/O counts as scale-split-io-forward-fast, but four policy workers.
notes: |
  Checks that raising policy alone no longer regresses versus the thin cell after per-slot transaction-store locking.
axes:
  runtime: split_io
  load_shape: forward_fast
  topology: thin
  ingress_workers: 2
  policy_workers: 4
  io_workers: 2
recipe:
  config: scale-split-io-policy-4-obs-off.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
