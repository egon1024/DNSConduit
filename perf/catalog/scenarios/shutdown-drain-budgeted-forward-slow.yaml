schema_version: 1
id: shutdown-drain-budgeted-forward-slow
suite: shutdown_drain
curated: true
summary: |
  Stop under load with a short drain timeout (drain-budgeted) while forwarding to a slow stub upstream. Records how long drain takes and how many client queries are lost in the stop window.
notes: |
  Paired with drain-complete and drain-minimal for relative comparison.
axes:
  runtime: sync
  load_shape: forward_slow
  drain_policy: drain_budgeted
  ingress_workers: 2
recipe:
  config: shutdown-drain-budgeted-forward-slow.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  shutdown: true
  stop_wait_s: 10
  load_time_s: 8
  min_answer_ok_percent: 0
