schema_version: 1
id: feature-tax-metrics-off-split-io-forward-fast
suite: feature_tax
curated: true
summary: |
  Observability-off baseline on the split_io runtime while forwarding to a fast stub upstream.
notes: |
  Paired with feature-tax-metrics-standard-scrape-split-io-forward-fast for scrape cost on split_io.
axes:
  runtime: split_io
  load_shape: forward_fast
  obs_posture: metrics_off
  ingress_workers: 2
  policy_workers: 2
  io_workers: 2
recipe:
  config: feature-tax-metrics-off-split-io.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
