schema_version: 1
id: scale-split-io-io-8-forward-slow
suite: scale
curated: true
summary: |
  split_io under a slow stub upstream with eight I/O workers and ingress/policy fixed at two each.
notes: |
  Optional noisy rung in the I/O series — keep in the catalog; publish may omit it if the lab is unstable.
axes:
