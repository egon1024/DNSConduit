schema_version: 1
id: scale-split-io-io-1-forward-slow
suite: scale
curated: true
summary: |
  split_io under a slow stub upstream with one I/O worker and ingress/policy fixed at two each.
notes: |
  Part of the I/O-versus-ingress sizing series (io_workers 1/2/4/8).
axes:
  runtime: split_io
  load_shape: forward_slow
  ingress_workers: 2
  policy_workers: 2
  io_workers: 1
recipe:
  config: scale-split-io-io-1-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
  duration_s: 30
