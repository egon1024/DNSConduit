schema_version: 1
id: scale-split-io-io-1-forward-slow
suite: scale
curated: true
intent: |
  I/O vs ingress (split_io): one I/O worker with fixed ingress/policy=2
  under forward_slow. Paired with io_workers 2/4/8 for io-vs-ingress-split.
axes:
  runtime: split_io
  load_shape: forward_slow
  ingress_workers: 2
  policy_workers: 2
  io_workers: 1
recipe:
  config: scale-split-io-io-1-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
  # Blocking runtimes complete very few queries against a 50 ms upstream;
  # a longer window keeps the sample large enough to mean something.
  duration_s: 30
