schema_version: 1
id: scale-sync-ingress-4-forward-slow
suite: scale
curated: true
intent: |
  Ingress concurrency (sync): four ingress workers under forward_slow.
  Paired with ingress 1/2/8 cells for the ingress-concurrency-sync study.
axes:
  runtime: sync
  load_shape: forward_slow
  ingress_workers: 4
recipe:
  config: scale-sync-ingress-4-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
  # Blocking runtimes complete very few queries against a 50 ms upstream;
  # a longer window keeps the sample large enough to mean something.
  duration_s: 30
