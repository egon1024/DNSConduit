schema_version: 1
id: feature-tax-logging-warn-forward-fast
suite: feature_tax
curated: true
summary: |
  Measures quieter logging: metrics are off and logging.level is warn while forwarding to a fast stub upstream.
notes: |
  Paired with the logging-debug cell. Named for the logging axis — it is not the shared metrics-off baseline used by other feature_tax studies.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: logging_warn
  ingress_workers: 2
recipe:
  config: feature-tax-logging-warn.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
