schema_version: 1
id: scale-split-io-forward-slow
suite: scale
curated: true
summary: |
  Throughput for the split_io runtime while every upstream answer is held for 50 ms (forward_slow).
notes: |
  Paired with scale-sync-forward-slow; slow upstream is where split_io should show its advantage.
axes:
  runtime: split_io
  load_shape: forward_slow
  ingress_workers: 2
  policy_workers: 2
  io_workers: 2
recipe:
  config: scale-split-io-obs-off.yml
  upstream: slow
  loadgen: dnsperf
  query_file: perf-a.txt
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
  duration_s: 30
