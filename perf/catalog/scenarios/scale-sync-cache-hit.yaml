schema_version: 1
id: scale-sync-cache-hit
suite: scale
curated: true
summary: |
  Warm memory-cache hits on the sync runtime: the harness fills the cache before dnsperf, then measures near-100% hits against a small answer set.
notes: |
  Read-mostly after warm — not a high-churn fill/evict shape. Optional for the published reference set; compare with scale-sync-lmdb-cache-hit via the memory-vs-lmdb-cache-hit study.
axes:
  runtime: sync
  load_shape: cache_hit
  ingress_workers: 2
  cache_backend: memory
recipe:
  config: scale-sync-cache-hit.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  cache_warm: true
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
