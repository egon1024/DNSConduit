schema_version: 1
id: feature-tax-metrics-standard-scrape-hammer-forward-fast
suite: feature_tax
curated: true
summary: |
  Same standard scrape posture as the listener-only scrape cell, but a lab client hammers /metrics about every 100 ms during the run.
notes: |
  Shows aggressive scrape cadence versus ordinary scrape traffic on the listener.
axes:
  runtime: sync
  load_shape: forward_fast
  obs_posture: metrics_standard_scrape_hammer
  ingress_workers: 2
recipe:
  config: feature-tax-metrics-standard-scrape.yml
  upstream: fast
  loadgen: dnsperf
  query_file: perf-a.txt
  scrape_hammer: true
  scrape_interval_ms: 100
  clients: 16
  dnsperf_threads: 8
  max_outstanding: 2000
