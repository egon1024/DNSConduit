[package]
name = "conduit-otlp-metrics-tracer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Lab OTLP HTTP metrics receiver: accept /v1/metrics pushes, count accepts/failures, optional slowdown"

[[bin]]
name = "conduit-otlp-metrics-tracer"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
