# Publish versioned operator documentation to gh-pages (mike) on product tags.
# Also workflow_dispatch: Release uses GITHUB_TOKEN for gh release create, which does not
# trigger tag-push workflows; Release explicitly dispatches this workflow after tagging.

name: Docs deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to deploy (e.g. 0.12.0). Must match an existing git tag.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docs-deploy-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs (${{ inputs.version || github.ref_name }})
    runs-on: ubuntu-latest
    env:
      DEPLOY_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Validate deploy version
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]; then
            echo "::error::Invalid deploy version: ${DEPLOY_VERSION}"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Fetch gh-pages for versions.json
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages 2>/dev/null || echo "No gh-pages branch yet (first deploy)."

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve mike alias flags
        id: aliases
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          bash .github/scripts/docs-deploy-aliases.sh "${TAG}" >> "$GITHUB_ENV"
          current_aliases=""
          expect_alias=false
          for flag in ${MIKE_ALIAS_ARGS:-} ${MIKE_STABLE_1_ARGS:-}; do
            if [[ "$flag" == --update-alias ]]; then
              expect_alias=true
              continue
            fi
            if [[ "$expect_alias" == true ]]; then
              current_aliases+="${flag},"
              expect_alias=false
            fi
          done
          current_aliases="${current_aliases%,}"
          echo "CURRENT_ALIASES=${current_aliases}" >> "$GITHUB_ENV"

      - name: Generate versions index
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
          CURRENT_ALIASES: ${{ env.CURRENT_ALIASES }}
        run: |
          set -euo pipefail
          VERSIONS_ARG=(--stub)
          if git show gh-pages:versions.json > /tmp/versions.json 2>/dev/null; then
            VERSIONS_ARG=(--versions-json /tmp/versions.json)
          fi
          GEN_ARGS=(
            "${VERSIONS_ARG[@]}"
            --output operator-docs/docs/versions.md
            --current-version "${TAG}"
          )
          if [[ -n "${CURRENT_ALIASES:-}" ]]; then
            GEN_ARGS+=(--current-aliases "${CURRENT_ALIASES}")
          fi
          python operator-docs/scripts/gen_versions_index.py "${GEN_ARGS[@]}"

      - name: Deploy with mike
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
          DOCS_PRODUCT_VERSION: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          cd operator-docs
          export DOCS_PRODUCT_VERSION="${TAG}"
          # shellcheck disable=SC2086
          mike deploy --push "${TAG}" ${MIKE_ALIAS_ARGS:-} ${MIKE_STABLE_1_ARGS:-}

      - name: Set site root redirect
        run: |
          set -euo pipefail
          cd operator-docs
          # Without this, https://egon1024.github.io/DNSConduit/ 404s while /latest/ works.
          if mike list | grep -qE '\blatest\b'; then
            mike set-default --push latest
          elif mike list | grep -qE '\bdev\b'; then
            mike set-default --push dev
          else
            echo "::warning::No latest or dev alias; skipping root redirect."
          fi

      - name: Refresh versions index from deployed gh-pages metadata
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages
          git show gh-pages:versions.json > /tmp/versions-after-deploy.json
          python operator-docs/scripts/gen_versions_index.py \
            --versions-json /tmp/versions-after-deploy.json \
            --output operator-docs/docs/versions.md \
            --current-version "${TAG}"

      - name: Redeploy docs with updated versions page
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
          DOCS_PRODUCT_VERSION: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          cd operator-docs
          export DOCS_PRODUCT_VERSION="${TAG}"
          # shellcheck disable=SC2086
          mike deploy --push "${TAG}" ${MIKE_ALIAS_ARGS:-} ${MIKE_STABLE_1_ARGS:-}
