# Publish versioned operator documentation to gh-pages (mike) on product tags.
# Also workflow_dispatch: Release uses GITHUB_TOKEN for gh release create, which does not
# trigger tag-push workflows; Release explicitly dispatches this workflow after tagging.

name: Docs deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to deploy (e.g. 0.12.0). Must match an existing git tag.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docs-deploy-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs (${{ inputs.version || github.ref_name }})
    runs-on: ubuntu-latest
    env:
      DEPLOY_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Validate deploy version
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]; then
            echo "::error::Invalid deploy version: ${DEPLOY_VERSION}"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Fetch gh-pages branch
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages 2>/dev/null || echo "No gh-pages branch yet (first deploy)."

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve mike alias flags
        id: aliases
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          bash .github/scripts/docs-deploy-aliases.sh "${TAG}" >> "$GITHUB_ENV"

      - name: Deploy with mike
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
          DOCS_PRODUCT_VERSION: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          cd operator-docs
          export DOCS_PRODUCT_VERSION="${TAG}"
          # shellcheck disable=SC2086
          mike deploy --push "${TAG}" ${MIKE_ALIAS_ARGS:-} ${MIKE_STABLE_1_ARGS:-}

      - name: Set site root redirect
        run: |
          set -euo pipefail
          cd operator-docs
          # Without this, https://egon1024.github.io/DNSConduit/ 404s while /latest/ works.
          if mike list | grep -qE '\blatest\b'; then
            mike set-default --push latest
          elif mike list | grep -qE '\bdev\b'; then
            mike set-default --push dev
          else
            echo "::warning::No latest or dev alias; skipping root redirect."
          fi

      - name: Publish global versions page to gh-pages root
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          PAGE_DIR="operator-docs/site-root/versions"
          PAGE_SRC="${PAGE_DIR}/index.html"
          DATES_SRC="${PAGE_DIR}/release-dates.json"
          # HTML template: prefer the tag tree; fall back to main for tags that
          # predate the global versions page. Dates always come from main so
          # release finalize / backfills publish without retagging.
          git fetch origin main --depth=1
          mkdir -p /tmp/global-versions
          if [[ -f "${PAGE_SRC}" ]]; then
            SRC_FILE="${PAGE_SRC}"
          else
            git show origin/main:"${PAGE_SRC}" > /tmp/global-versions/index.html
            SRC_FILE="/tmp/global-versions/index.html"
          fi
          if git cat-file -e "origin/main:${DATES_SRC}" 2>/dev/null; then
            git show origin/main:"${DATES_SRC}" > /tmp/global-versions/release-dates.json
            DATES_FILE="/tmp/global-versions/release-dates.json"
          else
            DATES_FILE=""
          fi

          # Run after mike's pushes; rebase on the freshest gh-pages so we never race.
          git fetch origin gh-pages:gh-pages
          WORK="$(mktemp -d)"
          git worktree add "${WORK}" gh-pages
          mkdir -p "${WORK}/versions"
          cp "${SRC_FILE}" "${WORK}/versions/index.html"
          if [[ -n "${DATES_FILE}" && -f "${DATES_FILE}" ]]; then
            cp "${DATES_FILE}" "${WORK}/versions/release-dates.json"
          fi
          (
            cd "${WORK}"
            if [[ -z "$(git status --porcelain versions/)" ]]; then
              echo "Global versions page already current; nothing to push."
              exit 0
            fi
            git add versions/
            git commit -m "docs: refresh global versions page (deploy ${TAG})"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          )
          git worktree remove "${WORK}" --force
