# Publish versioned operator documentation to gh-pages (mike) on product tags.
# Also workflow_dispatch: Release uses GITHUB_TOKEN for gh release create, which does not
# trigger tag-push workflows; Release explicitly dispatches this workflow after tagging.
#
# Auto-deploy is intentionally limited to stable MAJOR.MINOR.PATCH tags. Pre-release
# '-dev.N' checkpoints (2.x forward-development line) do NOT publish operator docs
# automatically; docs for the next major go live only when its stable tag ships.
# A one-off dev deploy is still possible via workflow_dispatch (routes to the 'dev'
# alias, never 'latest', per docs-deploy-aliases.sh).

name: Docs deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to deploy (e.g. 0.12.0 or 2.0.0-dev.1). Must match an existing git tag.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docs-deploy-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs (${{ inputs.version || github.ref_name }})
    runs-on: ubuntu-latest
    env:
      DEPLOY_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Validate deploy version
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]; then
            echo "::error::Invalid deploy version: ${DEPLOY_VERSION}"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          pip install -r requirements.txt
          pip install -r perf/requirements.txt

      - name: Fetch gh-pages branch
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages 2>/dev/null || echo "No gh-pages branch yet (first deploy)."

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve mike alias flags
        id: aliases
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          bash .github/scripts/docs-deploy-aliases.sh "${TAG}" >> "$GITHUB_ENV"

      - name: Generate performance docs from committed reference JSON
        run: |
          set -euo pipefail
          # Presentation only — no Conduit / dnsperf / load suites.
          PYTHONPATH=. python3 -m perf.runner generate-docs

      - name: Deploy with mike
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
          DOCS_PRODUCT_VERSION: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          cd operator-docs
          export DOCS_PRODUCT_VERSION="${TAG}"
          # mike takes aliases as POSITIONAL args plus a single --update-aliases
          # flag; it has no value-taking "--update-alias" option. The alias
          # resolver may emit "--update-alias <name>" tokens, so strip those and
          # collect the bare alias names. Passing repeated "--update-alias <name>"
          # only ever worked with a single alias; two aliases (e.g. latest +
          # stable-1 on the first 1.x stable) overflow the positional slot.
          aliases=()
          # shellcheck disable=SC2086
          for tok in ${MIKE_ALIAS_ARGS:-} ${MIKE_STABLE_1_ARGS:-}; do
            case "$tok" in
              --update-alias|--update-aliases) ;;
              *) aliases+=("$tok") ;;
            esac
          done
          if [[ ${#aliases[@]} -gt 0 ]]; then
            mike deploy --push --update-aliases "${TAG}" "${aliases[@]}"
          else
            mike deploy --push "${TAG}"
          fi

      - name: Set site root redirect
        run: |
          set -euo pipefail
          cd operator-docs
          # Without this, https://egon1024.github.io/DNSConduit/ 404s while /latest/ works.
          if mike list | grep -qE '\blatest\b'; then
            mike set-default --push latest
          elif mike list | grep -qE '\bdev\b'; then
            mike set-default --push dev
          else
            echo "::warning::No latest or dev alias; skipping root redirect."
          fi

      - name: Publish global versions page to gh-pages root
        env:
          TAG: ${{ env.DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          PAGE_DIR="operator-docs/site-root/versions"
          PAGE_SRC="${PAGE_DIR}/index.html"
          DATES_SRC="${PAGE_DIR}/release-dates.json"
          # HTML template: prefer the checked-out tag tree; fall back to main only
          # for tags that predate the global versions page (rare).
          #
          # Release dates must NOT be taken from a fixed branch name: after 1.0,
          # finalize writes dates on the release line (e.g. 1.x) and the tag, while
          # main stays frozen. Merge (1) dates already on gh-pages with (2) the
          # dates file from this deploy checkout so any release line publishes
          # correctly and redeploying an older tag cannot drop newer dates.
          mkdir -p /tmp/global-versions
          if [[ -f "${PAGE_SRC}" ]]; then
            SRC_FILE="${PAGE_SRC}"
          else
            git fetch origin main --depth=1
            git show origin/main:"${PAGE_SRC}" > /tmp/global-versions/index.html
            SRC_FILE="/tmp/global-versions/index.html"
          fi
          CHECKOUT_DATES=""
          if [[ -f "${DATES_SRC}" ]]; then
            CHECKOUT_DATES="${DATES_SRC}"
          fi

          # Load merge helper from the workflow revision (GITHUB_SHA), not the
          # product-tag tree. That way workflow_dispatch --ref 1.x -f version=1.1.0
          # (and future release-line branches) apply current deploy logic even when
          # the tag predates this script.
          MERGE_SCRIPT="/tmp/global-versions/merge_release_dates_json.py"
          if ! git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          if ! git cat-file -e "${GITHUB_SHA}:operator-docs/scripts/merge_release_dates_json.py" 2>/dev/null; then
            echo "::error::merge_release_dates_json.py missing at ${GITHUB_SHA}; refuse to publish a stale dates map from a fixed branch."
            exit 1
          fi
          git show "${GITHUB_SHA}:operator-docs/scripts/merge_release_dates_json.py" > "${MERGE_SCRIPT}"

          # Run after mike's pushes; rebase on the freshest gh-pages so we never race.
          git fetch origin gh-pages:gh-pages
          WORK="$(mktemp -d)"
          git worktree add "${WORK}" gh-pages
          mkdir -p "${WORK}/versions"
          cp "${SRC_FILE}" "${WORK}/versions/index.html"
          merge_args=(--output "${WORK}/versions/release-dates.json")
          if [[ -f "${WORK}/versions/release-dates.json" ]]; then
            cp "${WORK}/versions/release-dates.json" /tmp/global-versions/published-release-dates.json
            merge_args+=(--input /tmp/global-versions/published-release-dates.json)
          fi
          if [[ -n "${CHECKOUT_DATES}" ]]; then
            merge_args+=(--input "${CHECKOUT_DATES}")
          fi
          if [[ ${#merge_args[@]} -eq 1 ]]; then
            echo "::warning::No release-dates.json on gh-pages or this tag; Versions page dates will be empty."
            echo '{}' > "${WORK}/versions/release-dates.json"
          else
            python3 "${MERGE_SCRIPT}" "${merge_args[@]}"
          fi
          (
            cd "${WORK}"
            if [[ -z "$(git status --porcelain versions/)" ]]; then
              echo "Global versions page already current; nothing to push."
              exit 0
            fi
            git add versions/
            git commit -m "docs: refresh global versions page (deploy ${TAG})"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          )
          git worktree remove "${WORK}" --force
