# Creates a semver tag and GitHub Release on merge to main, then dispatches docs and release artifacts.
#
# Ordering: version + release notes are committed to main before any tag or GitHub Release.
# Docs deploy and artifact builds run only after gh release create succeeds.
# See docs/superpowers/process/release-workflow-manual-testing.md for failure recovery.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Publish this version (e.g. 0.12.0). Use when main already has the Cargo bump
          and release notes but the GitHub release failed. Leave empty to compute from
          tags and PR bump rules.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    # Skip the chore:release bump commit (avoids loop). workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore: release ')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve merged pull request body
        if: github.event_name != 'workflow_dispatch'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-pr-body.sh "${{ github.event.head_commit.message }}"

      - name: Use manual release version
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        id: manual_version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          ver="${RELEASE_VERSION#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must be MAJOR.MINOR.PATCH (got: ${RELEASE_VERSION})"
            exit 1
          fi
          echo "next_version=${ver}" >>"$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.manual_version.outputs.next_version == ''
        uses: ./.github/actions/version-bump
        with:
          pr_body: ${{ steps.pr.outputs.body || '' }}
          default_bump: minor

      - name: Select release version
        id: release_version
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.manual_version.outputs.next_version }}" ]]; then
            echo "next_version=${{ steps.manual_version.outputs.next_version }}" >>"$GITHUB_OUTPUT"
          else
            echo "next_version=${{ steps.version.outputs.next_version }}" >>"$GITHUB_OUTPUT"
          fi

      - name: Validate version bump
        if: steps.version.outputs.error != ''
        run: |
          echo "::error::Release version bump failed (${{ steps.version.outputs.error }})"
          exit 1

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          if gh release view "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Release ${NEXT_VERSION} already exists; skipping."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        if: steps.exists.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Install Rust toolchain
        if: steps.exists.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Bump Cargo.toml workspace version and resync Cargo.lock
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: bash .github/scripts/bump-cargo-versions.sh

      - name: Finalize release notes
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          python3 operator-docs/scripts/finalize_release_notes.py \
            --version "${NEXT_VERSION}" \
            --release-date "$(date -u +%Y-%m-%d)" \
            --repo "https://github.com/${GITHUB_REPOSITORY}"

      - name: Verify operator docs build
        if: steps.exists.outputs.skip != 'true'
        run: make docs-build

      - name: Commit release preparation
        if: steps.exists.outputs.skip != 'true'
        id: commit
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
          # Admin PAT (repo owner): push release branch + gh pr merge --admin.
          # Direct pushes to main are blocked by rulesets even with a PAT unless bypass mode is Always.
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is not configured (admin PAT for release bump PR)."
            exit 1
          fi

          git add Cargo.toml Cargo.lock \
            operator-docs/docs/release-notes/ \
            operator-docs/site-root/versions/release-dates.json
          if git diff --cached --quiet; then
            echo "committed=false" >>"$GITHUB_OUTPUT"
            echo "Release preparation already on main for ${NEXT_VERSION}; skipping commit."
            exit 0
          fi

          release_branch="chore/release-${NEXT_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release ${NEXT_VERSION}"
          # Ephemeral branch; replace prior failed run (non-fast-forward).
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${release_branch}" 2>/dev/null || true
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${release_branch}"

          pr_number="$(gh pr list --head "${release_branch}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create --base main --head "${release_branch}" \
              --title "chore: release ${NEXT_VERSION}" \
              --body "Automated version bump and release notes for ${NEXT_VERSION}. #no-docs"
            pr_number="$(gh pr view "${release_branch}" --json number --jq .number)"
          fi
          gh pr merge "${pr_number}" --rebase --admin --delete-branch
          echo "committed=true" >>"$GITHUB_OUTPUT"

      - name: Verify release preparation on main
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          git fetch origin main
          notes_path="operator-docs/docs/release-notes/${NEXT_VERSION}.md"
          if ! git cat-file -e "origin/main:${notes_path}" 2>/dev/null; then
            echo "::error::Release notes missing on main: ${notes_path}"
            exit 1
          fi
          # Note: awk must not `exit` early here. Exiting closes the pipe while
          # `git show` is still writing, which raises SIGPIPE; under `pipefail`
          # that fails the step with exit code 141. Read all input and emit the
          # first match at END instead.
          cargo_ver="$(git show "origin/main:Cargo.toml" | awk '
            /^\[workspace\.package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version = / && ver == "" {
              val=$3
              gsub(/"/, "", val)
              ver=val
            }
            END { print ver }
          ')"
          if [[ "${cargo_ver}" != "${NEXT_VERSION}" ]]; then
            echo "::error::Cargo.toml on main is ${cargo_ver:-unknown}; expected ${NEXT_VERSION}"
            exit 1
          fi
          lock_ver="$(git show "origin/main:Cargo.lock" | awk '
            /^name = "conduit"$/ { want=1; next }
            want && /^version = / && ver == "" {
              val=$3
              gsub(/"/, "", val)
              ver=val
            }
            END { print ver }
          ')"
          if [[ "${lock_ver}" != "${NEXT_VERSION}" ]]; then
            echo "::error::Cargo.lock on main pins conduit ${lock_ver:-unknown}; expected ${NEXT_VERSION}"
            exit 1
          fi
          dates_path="operator-docs/site-root/versions/release-dates.json"
          if ! git show "origin/main:${dates_path}" | grep -q "\"${NEXT_VERSION}\""; then
            echo "::error::${dates_path} on main is missing ${NEXT_VERSION}"
            exit 1
          fi
          if git rev-parse "refs/tags/${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEXT_VERSION} already exists locally; refusing to create release"
            exit 1
          fi
          echo "Verified ${notes_path}, Cargo.toml, Cargo.lock, and ${dates_path} ${NEXT_VERSION} on origin/main."

      - name: Create GitHub Release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          git fetch origin main
          if gh release view "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "::error::Release ${NEXT_VERSION} already exists"
            exit 1
          fi
          gh release create "$NEXT_VERSION" \
            --target main \
            --title "$NEXT_VERSION" \
            --generate-notes

      # GITHUB_TOKEN release/tag does not trigger tag-push workflows; dispatch explicitly.
      - name: Trigger docs deploy
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          gh workflow run docs-deploy.yml \
            --ref "${NEXT_VERSION}" \
            -f "version=${NEXT_VERSION}"
          echo "Dispatched Docs deploy for ${NEXT_VERSION}."

      - name: Trigger release artifacts build
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          gh workflow run build-release-artifacts.yml \
            --ref "${NEXT_VERSION}" \
            -f "version=${NEXT_VERSION}"
          echo "Dispatched release artifacts build for ${NEXT_VERSION}."
