# Require refreshed interop/results when interop-relevant paths change.
# Override: #no-interop-matrix in PR description (with reason). No label override.
# Does NOT run the Docker interop suite.

name: Interop matrix required

on:
  pull_request:
    branches: [main, 1.x, 2.x]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  interop-matrix-required:
    name: Interop matrix freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip3 install --user pyyaml

      - name: Check interop matrix freshness
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/interop-matrix-required.sh
