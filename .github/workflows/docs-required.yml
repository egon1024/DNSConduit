# Require operator-docs/ or README.md updates when operator-surface paths change.
# Override: #no-docs in PR description (with reason). No label override.

name: Docs required

on:
  pull_request:
    branches: [main, 1.x, 2.x]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  docs-required:
    name: Documentation update required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check documentation policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/docs-required.sh
