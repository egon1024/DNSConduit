# Build and upload GitHub release assets for an existing semver tag.
# Invoked from release.yml (workflow_call) or manually (workflow_dispatch).

name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Semver tag to build (e.g. 0.14.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to build (e.g. 0.14.0). Must match an existing git tag.
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-artifacts-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build and upload (${{ inputs.version }})
    runs-on: ubuntu-22.04
    steps:
      - name: Validate version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-dev.N (got: ${RELEASE_VERSION})"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_VERSION }}

      - name: Verify tag exists
        run: |
          set -euo pipefail
          git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}" >/dev/null

      - name: Fail if release assets already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${RELEASE_VERSION} does not exist yet"
            exit 1
          fi
          expected=(
            "conduit-${RELEASE_VERSION}-amd64.tar.gz"
            "conduit-${RELEASE_VERSION}-amd64-debug.tar.gz"
            "conduit_${RELEASE_VERSION}_amd64.deb"
            "conduit-dbg_${RELEASE_VERSION}_amd64.deb"
            "conduit-${RELEASE_VERSION}.spdx.json"
            "SHA256SUMS"
            "conduit-${RELEASE_VERSION}.image-digest.txt"
          )
          existing="$(gh release view "${RELEASE_VERSION}" --json assets --jq '.assets[].name' || true)"
          for name in "${expected[@]}"; do
            if echo "${existing}" | grep -qx "${name}"; then
              echo "::error::Release asset already exists: ${name}. Delete it before rebuilding."
              exit 1
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION=2.41.2
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Build release artifacts
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: bash .github/scripts/build-release-artifacts.sh

      - name: Build and push container image
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${IMAGE_OWNER}/dnsconduit"

          # Docker Hub is an optional additional registry: it is only wired when
          # both DOCKERHUB_USERNAME (repo variable) and DOCKERHUB_TOKEN (secret)
          # are configured, so the release does not hard-fail before setup.
          DOCKERHUB_ENABLED=false
          HUB_IMAGE=""
          if [[ -n "${DOCKERHUB_TOKEN:-}" && -n "${DOCKERHUB_USERNAME:-}" ]]; then
            DOCKERHUB_ENABLED=true
            HUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/dnsconduit"
          else
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured; skipping Docker Hub push (GHCR only)."
          fi

          # ':latest' tracks the newest stable release of the highest stable major.
          # Pre-release '-dev.N' checkpoints are excluded and never move ':latest'.
          # Mirrors the docs 'latest' alias rule in docs-deploy-aliases.sh.
          git fetch --tags --force
          newest_stable="$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          push_latest=false
          if [[ "${RELEASE_VERSION}" == "${newest_stable}" ]]; then
            push_latest=true
          fi

          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
            echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
          fi

          build_args=( -t "${GHCR_IMAGE}:${RELEASE_VERSION}" )
          if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
            build_args+=( -t "${HUB_IMAGE}:${RELEASE_VERSION}" )
          fi
          if [[ "${push_latest}" == "true" ]]; then
            build_args+=( -t "${GHCR_IMAGE}:latest" )
            if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
              build_args+=( -t "${HUB_IMAGE}:latest" )
            fi
          fi
          # --pull refreshes debian:bookworm-slim (and the Rust builder) so the
          # Dockerfile's apt-get upgrade applies against current security archives
          # rather than a stale cached base layer.
          docker build --pull "${build_args[@]}" -f Dockerfile .

          docker push "${GHCR_IMAGE}:${RELEASE_VERSION}"
          if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
            docker push "${HUB_IMAGE}:${RELEASE_VERSION}"
          fi
          if [[ "${push_latest}" == "true" ]]; then
            docker push "${GHCR_IMAGE}:latest"
            if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
              docker push "${HUB_IMAGE}:latest"
            fi
          else
            echo "::notice::${RELEASE_VERSION} is not the newest stable release (${newest_stable:-none}); leaving :latest unchanged."
          fi

          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${GHCR_IMAGE}:${RELEASE_VERSION}" | awk -F@ '{print $2}')"
          if [[ -z "${DIGEST}" ]]; then
            DIGEST="$(docker image inspect --format='{{.Id}}' "${GHCR_IMAGE}:${RELEASE_VERSION}")"
          fi
          {
            echo "ghcr_image=${GHCR_IMAGE}:${RELEASE_VERSION}"
            if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
              echo "dockerhub_image=${HUB_IMAGE}:${RELEASE_VERSION}"
            fi
            echo "digest=${DIGEST}"
          } > "release-artifacts/conduit-${RELEASE_VERSION}.image-digest.txt"
          # Include digest file in SHA256SUMS
          (
            cd release-artifacts
            sha256sum "conduit-${RELEASE_VERSION}.image-digest.txt" >>SHA256SUMS
          )

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_VERSION}" release-artifacts/*

      - name: Attest release artifacts (SLSA provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/conduit-${{ env.RELEASE_VERSION }}-amd64.tar.gz
            release-artifacts/conduit-${{ env.RELEASE_VERSION }}-amd64-debug.tar.gz
            release-artifacts/conduit_${{ env.RELEASE_VERSION }}_amd64.deb
            release-artifacts/conduit-dbg_${{ env.RELEASE_VERSION }}_amd64.deb

  smoke-test-deb:
    name: Install .deb on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for gh)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download production .deb from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.version }}" \
            -p "conduit_${{ inputs.version }}_amd64.deb" \
            -D /tmp/deb-test

      - name: Install and verify
        run: |
          set -euo pipefail
          sudo dpkg -i "/tmp/deb-test/conduit_${{ inputs.version }}_amd64.deb" || sudo apt-get -f install -y
          test -x /usr/bin/conduit
          test -x /usr/bin/conduitctl
          test -x /usr/bin/conduit-dnstap-tracer
          test -x /usr/bin/conduit-otlp-metrics-tracer
          test -f /etc/conduit/conduit.yaml
          systemctl is-enabled conduit.service
          [[ "$(systemctl is-active conduit.service)" == "inactive" ]]
          dpkg -s conduit | grep -q '^Status: install ok installed'
