name: Version preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: version-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview next release version
    runs-on: ubuntu-latest
    steps:
      # Use trusted base-branch scripts only; PR body is untrusted data passed as input.
      # Checkout the PR base ref (target branch tip), not repository.default_branch, so PRs
      # into a non-default target branch still resolve ./.github/actions/version-bump correctly.
      - name: Checkout PR base branch (trusted scripts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      - name: Require version-bump composite on base branch
        run: |
          if [[ ! -f trusted/.github/actions/version-bump/action.yml ]]; then
            echo "::error::Missing trusted/.github/actions/version-bump/action.yml on PR base ref" \
              "${{ github.event.pull_request.base.ref }} (${{ github.event.pull_request.base.sha }})." \
              "Add .github/actions/version-bump to that branch (e.g. merge development work into the PR target branch) so this job can run."
            exit 1
          fi

      - name: Compute next version
        id: version
        uses: ./trusted/.github/actions/version-bump
        with:
          pr_body: ${{ github.event.pull_request.body }}
          default_bump: minor

      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION_ERROR: ${{ steps.version.outputs.error }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          BUMP_LEVEL: ${{ steps.version.outputs.bump_level }}
          BUMP_SOURCE: ${{ steps.version.outputs.bump_source }}
        run: bash trusted/.github/scripts/pr-version-comment.sh

      - name: Fail on version error
        if: steps.version.outputs.error != ''
        run: |
          echo "::error::Version preview failed (${{ steps.version.outputs.error }})"
          exit 1
