name: Version preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: version-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview next release version
    runs-on: ubuntu-latest
    steps:
      # Merge ref: full tree from PR + base (so .github/ exists even when the base branch tip
      # is sparse). PR body is still untrusted; only passed into the bump script as env.
      - name: Checkout merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same commit as the PR target branch tip: use these copies of scripts when present so
      # forks cannot swap workflow-adjacent bash without a base-branch update.
      - name: Checkout PR base into trusted/
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      - name: Compute next version
        id: version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DEFAULT_BUMP: minor
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -f trusted/.github/actions/version-bump/version-bump.sh ]]; then
            bash trusted/.github/actions/version-bump/version-bump.sh
          elif [[ -f .github/actions/version-bump/version-bump.sh ]]; then
            echo "::notice::Using merge-ref version-bump.sh (missing on PR base ${{ github.event.pull_request.base.ref }}). For PRs from untrusted forks, add .github/actions/version-bump to the base branch."
            bash .github/actions/version-bump/version-bump.sh
          else
            echo "::error::Could not find version-bump.sh under trusted/ or .github/actions/version-bump/."
            exit 1
          fi

      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION_ERROR: ${{ steps.version.outputs.error }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          BUMP_LEVEL: ${{ steps.version.outputs.bump_level }}
          BUMP_SOURCE: ${{ steps.version.outputs.bump_source }}
        run: |
          set -euo pipefail
          if [[ -f trusted/.github/scripts/pr-version-comment.sh ]]; then
            bash trusted/.github/scripts/pr-version-comment.sh
          elif [[ -f .github/scripts/pr-version-comment.sh ]]; then
            echo "::notice::Using merge-ref pr-version-comment.sh (missing on PR base ${{ github.event.pull_request.base.ref }})."
            bash .github/scripts/pr-version-comment.sh
          else
            echo "::error::Could not find pr-version-comment.sh under trusted/ or .github/scripts/."
            exit 1
          fi

      - name: Fail on version error
        if: steps.version.outputs.error != ''
        run: |
          echo "::error::Version preview failed (${{ steps.version.outputs.error }})"
          exit 1
