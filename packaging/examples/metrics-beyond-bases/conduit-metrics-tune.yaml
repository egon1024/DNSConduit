# Lab example for the Metrics beyond bases guide (baseline).
# Category / granularity / overlay steps stay in the guide.
# Default ports: DNS 15353, metrics 9090, control 5199; upstream :5300.
schema_version: 1
listeners:
  listeners:
    - address: "127.0.0.1:15353"
      protocol: udp
pools:
  - name: default
    backends:
      - address: "127.0.0.1:5300"
control:
  listen_address: "127.0.0.1:5199"
metrics:
  enabled: true
  base: standard
  prometheus:
    listen_address: "127.0.0.1:9090"
    path: /metrics
