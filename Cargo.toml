[workspace]
resolver = "2"
members = [
    "crates/conduit-proto",
    "crates/conduit-config",
    "crates/conduit-core",
    "crates/conduit-dataplane",
    "crates/conduit-api",
    "crates/conduit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
arc-swap = "1"
tokio-stream = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hickory-proto = "0.24"
socket2 = { version = "0.5", features = ["all"] }
