[workspace]
resolver = "2"
members = [
    "crates/conduit-proto",
    "crates/conduit-dns-wire",
    "crates/conduit-config",
    "crates/conduit-core",
    "crates/conduit-events",
    "crates/conduit-metrics",
    "crates/conduit-dataplane",
    "crates/conduit-api",
    "crates/conduit",
    "crates/conduitctl",
    "crates/conduit-dnstap-tracer",
    "crates/conduit-script",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
authors = ["Cole Tuininga <cole@tuininga.org>"]
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
tonic-reflection = "0.12"
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
arc-swap = "1"
tokio-stream = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hickory-proto = "0.24"
socket2 = { version = "0.5", features = ["all"] }
crossbeam-channel = "0.5"
polling = "3"
dnstap = "0.1.7"
protobuf = "3.7"
rhai = { version = "1.20", features = ["sync"] }
prometheus = "0.13"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
opentelemetry = { version = "0.27", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "http-proto",
    "metrics",
    "reqwest-client",
    "reqwest-rustls-webpki-roots",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
