schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.0.1:15353"
      protocol: udp
forward:
  outstanding_per_backend: 50
  timeout_ms: 2000
  sources_v6:
    - "::1"
  source_selection: round_robin
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
rhai:
  max_operations: 10000
  max_call_depth: 32
pools:
  - name: v6
    sources_v6:
      - "::1"
    backends:
      - address: "[::1]:5300"
        weight: 100
rules:
  match_mode: first_match
  rules:
    - id: set-source-v6
      hook: request
      selectors: []
      actions:
        - type: rhai
          value: ../rhai/set-source-v6.rhai
        - type: set_pool
          value: v6
control:
  listen_address: "127.0.0.1:5199"
