# Failure convergence — no pool resolvable (no_pool)
schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: lab-udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 500
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
pools: []
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  profile: full
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
tracing:
  enabled: true
  sample_rate: 1.0
