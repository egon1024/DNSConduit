# Cache policy: cache + cross-pool SERVFAIL retry (cache bypass on re-entry).
# Procedure: docs/superpowers/plans/2026-07-06-pluggable-lookup-cache-policy-manual-lab.md
schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: lab-udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 10000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
pools:
  - name: primary
    backends:
      - address: "127.0.2.1:15300"
        name: primary-upstream
        weight: 100
  - name: secondary
    backends:
      - address: "127.0.2.1:15399"
        name: secondary-upstream
        weight: 100
caches:
  - name: global
    type: memory
    max_entries: 10000
    negative_cache:
      enabled: true
      nxdomain_covers_descendants: true
      servfail_ttl_secs: 10
lookup:
  profiles:
    default:
      providers:
        - type: cache
          cache: global
        - type: forward
rules:
  match_mode: first_match
  rules:
    - name: use-primary
      hook: request
      selectors:
        - type: qname_suffix
          value: ".policy-lab.test.example."
      actions:
        - type: set_pool
          value: primary
    - name: servfail-retry
      hook: response
      selectors:
        - type: rcode
          value: SERVFAIL
      actions:
        - type: set_retry_pool
          value: secondary
        - type: retry
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  profile: full
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
