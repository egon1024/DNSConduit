# Response-rule failover after primary forward failure (dead upstream).
# SERVFAIL selector + set_retry_pool secondary + retry. Do not use empty
# selectors: they also match the successful secondary answer and retry-loop
# until max_txn_duration.
# route_failure_policy: response_rules keeps the same failover path available
# when Route itself fails (pool exhaustion).
schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: lab-udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 300
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
  route_failure_policy: response_rules
pools:
  - name: primary
    backends:
      - address: "127.0.2.1:15399"
        name: dead-primary
        weight: 100
  - name: secondary
    backends:
      - address: "127.0.2.1:15300"
        name: live-secondary
        weight: 100
rules:
  match_mode: first_match
  rules:
    - name: failover
      hook: response
      selectors:
        - type: rcode
          value: SERVFAIL
      actions:
        - type: set_retry_pool
          value: secondary
        - type: retry
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  profile: full
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
tracing:
  enabled: true
  sample_rate: 1.0
