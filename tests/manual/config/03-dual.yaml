schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.0.1:15353"
      protocol: udp
    - address: "[::1]:15354"
      protocol: udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 3000
  sources_v4:
    - "127.0.0.1"
  sources_v6:
    - "::1"
  source_selection: round_robin
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 8000
  txn_table_capacity: 1024
observation:
  queue_depth: 8192
  drop_policy: drop_oldest
  sinks:
    - type: dnstap
      name: manual
      export_id: manual-ipv6
      destinations:
        - "unix:/tmp/conduit-manual-dnstap.sock"
      emit:
        - query
        - response
      extra_fields:
        - pool
        - backend
        - attempt_count
rhai:
  max_operations: 10000
  max_call_depth: 32
pools:
  - name: v4
    backends:
      - address: "127.0.0.1:15300"
        weight: 100
  - name: v6
    backends:
      - address: "[::1]:15301"
        weight: 100
rules:
  match_mode: first_match
  rules:
    - id: v4-suffix
      hook: request
      selectors:
        - type: qname_suffix
          value: ".v4.manual."
      actions:
        - type: set_pool
          value: v4
    - id: v6-suffix
      hook: request
      selectors:
        - type: qname_suffix
          value: ".v6.manual."
      actions:
        - type: set_pool
          value: v6
control:
  listen_address: "127.0.0.1:15199"
