# Observability lab — cache metrics, tracing, dnstap answer_source, response-hook answer_source.
# Procedure: docs/superpowers/plans/2026-07-07-pluggable-lookup-observability-manual-lab.md
schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: lab-udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
  sinks:
    - type: dnstap
      name: cache-hit-tap
      destinations:
        - "unix:/tmp/conduit-obs-lab-dnstap.sock"
      emit:
        - response
      filters:
        selectors:
          - type: answer_source
            value: cache
      extra_fields:
        - answer_source
        - cache_instance
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
        name: resolver-east
        weight: 100
caches:
  - name: global
    type: memory
    max_entries: 10000
    negative_cache:
      enabled: true
      nxdomain_covers_descendants: true
      servfail_ttl_secs: 10
lookup:
  profiles:
    default:
      providers:
        - type: cache
          cache: global
        - type: forward
rules:
  match_mode: first_match
  rules:
    - name: response-answer-source-check
      hook: response
      selectors:
        - type: qname_suffix
          value: ".obs-lab.test.example."
      actions:
        - type: rhai
          value: ../../fixtures/rhai/answer-source-check.rhai
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  profile: full
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
tracing:
  enabled: true
  activation:
    selectors:
      - type: qname_suffix
        value: ".obs-lab.test.example."
    sample_percent: 100
  output:
    log_json: false
rhai:
  max_operations: 10000
  max_call_depth: 32
  hook_timeout_ms: 50
