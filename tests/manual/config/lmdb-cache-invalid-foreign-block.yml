# Invalid: memory block on type lmdb. Expect ctl validate failure.
schema_version: 1
listeners:
  threads: 1
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
caches:
  - name: durable
    type: lmdb
    memory:
      shard_count: 4
    lmdb:
      path: /tmp/conduit-lmdb-lab/durable
      map_size: 16MB
lookup:
  profiles:
    default:
      providers:
        - type: cache
          cache: durable
        - type: forward
