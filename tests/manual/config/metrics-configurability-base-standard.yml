# G1 manual lab: metrics.base: standard — must reproduce today's profile: full
# label schema exactly (qtype/qclass/ip_family, per-rcode, phase/forward histograms).
schema_version: 1
listeners:
  threads: 2
  reuse_port: true
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
rhai:
  max_operations: 10000
  max_call_depth: 32
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
        weight: 50
      - address: "127.0.2.1:15300"
        weight: 50
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  base: standard
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
