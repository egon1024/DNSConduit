# Profile selection lab — client CIDR rule selects the live lookup profile.
schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
      name: lab-udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
        name: live-resolver
        weight: 100
  - name: dead
    backends:
      - address: "127.0.2.1:15399"
        name: dead-resolver
        weight: 100
lookup:
  profiles:
    default:
      providers:
        - type: forward
    live:
      providers:
        - type: forward
data_sources:
  - name: corp_nets
    type: cidr
    path: ../fixtures/cidr/profile-selection-corp.txt
rules:
  match_mode: first_match
  rules:
    - name: corp-live-profile
      hook: request
      selectors:
        - type: client_cidr
          value: corp_nets
      actions:
        - type: set_lookup_profile
          value: live
        - type: set_pool
          value: default
    - name: default-dead-pool
      hook: request
      selectors: []
      actions:
        - type: set_pool
          value: dead
control:
  listen_address: "127.0.2.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  profile: minimal
  prometheus:
    listen_address: "127.0.2.1:19090"
    path: /metrics
tracing:
  enabled: true
  sample_rate: 1.0
