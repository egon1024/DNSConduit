# Manual validation for sample_percent key / key_from (see docs/superpowers/plans/manual-lab-rhai-sample-keys.md).
schema_version: 1
listeners:
  threads: 1
  reuse_port: true
  listeners:
    - address: "127.0.2.1:15353"
      protocol: udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
rules:
  match_mode: first_match
  rules:
    - name: audit-zone
      hook: request
      selectors:
        - type: qname_suffix
          value: ".audit.example."
        - type: sample_percent
          value: "25"
          key: "audit.example"
      actions:
        - type: set_tag
          value: audit_sampled=true
pools:
  - name: default
    backends:
      - address: "127.0.2.1:15300"
        weight: 100
rhai:
  max_operations: 10000
  max_call_depth: 32
control:
  listen_address: "127.0.2.1:5199"
