# Manual lab — ordered rule actions (drop family, set_retry_pool, rhai interleaving).
# Procedure: tests/manual/ordered-rule-actions.md
schema_version: 1
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "127.0.0.1:15353"
      protocol: udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 3000
  sources_v4:
    - "127.0.0.1"
    - "10.0.0.5"
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 8000
  txn_table_capacity: 1024
events:
  queue_depth: 8192
  drop_policy: drop_oldest
rhai:
  max_operations: 10000
  max_call_depth: 32
  hook_timeout_ms: 50
pools:
  - name: default
    backends:
      - address: "127.0.0.1:15300"
        weight: 100
  - name: vip
    backends:
      - address: "127.0.0.1:15301"
        weight: 100
  - name: backup
    backends:
      - address: "127.0.0.1:15301"
        weight: 100
rules:
  match_mode: first_match
  rules:
    - name: soft-drop-then-tag
      hook: request
      selectors:
        - type: qname_suffix
          value: ".soft-drop."
      actions:
        - type: drop
        - type: set_tag
          value: audited=true
    - name: hard-drop
      hook: request
      selectors:
        - type: qname_suffix
          value: ".hard-drop."
      actions:
        - type: drop_now
        - type: set_tag
          value: skipped=true
    - name: clear-soft-drop
      hook: request
      selectors:
        - type: qname_suffix
          value: ".clear-drop."
      actions:
        - type: drop
        - type: clear_drop
    - name: stash-retry-pool
      hook: request
      selectors:
        - type: qname_suffix
          value: ".retry-stash."
      actions:
        - type: set_pool
          value: default
        - type: set_retry_pool
          value: backup
    - name: rhai-order-demo
      hook: request
      selectors:
        - type: qname_suffix
          value: ".order-demo."
      actions:
        - type: rhai
          value: ../../fixtures/rhai/set-vip-pool.rhai
        - type: set_pool
          value: default
    - name: stash-retry-source
      hook: request
      selectors:
        - type: qname_suffix
          value: ".retry-src."
      actions:
        - type: set_pool
          value: default
        - type: set_retry_source_v4
          value: "10.0.0.5"
