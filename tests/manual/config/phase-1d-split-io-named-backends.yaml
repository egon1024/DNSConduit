# Phase 1d — split_io with named backends (metrics label + overlay-by-name lab).
schema_version: 1
dataplane:
  runtime: split_io
  policy_workers: 4
  io_workers: 1
listeners:
  threads: 2
  reuse_port: true
  listeners:
    - address: "127.0.0.1:15353"
      protocol: udp
      name: lab-udp
forward:
  outstanding_per_backend: 100
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
pools:
  - name: default
    backends:
      - name: resolver-east
        address: "127.0.0.1:15300"
        weight: 100
control:
  listen_address: "127.0.0.1:5199"
  reflection_enabled: true
metrics:
  enabled: true
  profile: full
  prometheus:
    listen_address: "127.0.0.1:19090"
    path: /metrics
