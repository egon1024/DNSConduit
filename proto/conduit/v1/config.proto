syntax = "proto3";

package conduit.v1;

// Canonical configuration model. Every tunable field lives here.

message Config {
  uint32 schema_version = 1;  // must be 1 for Phase 0
  ListenersConfig listeners = 2;
  ForwardConfig forward = 3;
  OrchestratorConfig orchestrator = 4;
  ObservationConfig observation = 5;
  RhaiConfig rhai = 6;
  repeated Pool pools = 7;
  ControlConfig control = 8;
  RulesConfig rules = 9;
  LoggingConfig logging = 10;
}

// Phase 1 dev/ops logging (not full transaction trace — see design §4.3).
message LoggingConfig {
  string level = 1;    // error | warn | info | debug | trace; default info
  string output = 2;   // stderr | stdout; default stderr
}

message RulesConfig {
  string match_mode = 1;   // "first_match" (phase 1)
  repeated Rule rules = 2;
}

message Rule {
  string id = 1;
  string hook = 2;           // "request" | "response"
  repeated Selector selectors = 3;
  repeated Action actions = 4;
}

message Selector {
  string type = 1;   // qname_suffix | qname_exact | qtype | rcode | tag
  string value = 2;
}

message Action {
  string type = 1;   // set_pool | set_tag | retry_pool | drop | set_rcode
  string value = 2;
}

message ListenersConfig {
  uint32 threads = 1;           // min 1
  bool reuse_port = 2;
  uint32 rcvbuf = 3;
  uint32 sndbuf = 4;
  repeated Listener listeners = 5;
}

message Listener {
  string address = 1;           // e.g. "0.0.0.0:53"
  string protocol = 2;          // "udp" | "tcp"
}

message ForwardConfig {
  uint32 outstanding_per_backend = 1;
  uint32 timeout_ms = 2;
}

message OrchestratorConfig {
  uint32 max_attempts = 1;
  uint32 max_txn_duration_ms = 2;
  uint32 txn_table_capacity = 3;
}

message ObservationConfig {
  uint32 queue_depth = 1;
  string drop_policy = 2;       // "drop_oldest" | "drop_newest"
  repeated ObservationSink sinks = 3;
}

message ObservationSinkFilters {
  optional string tag_required = 1;
}

message ConnectRetry {
  uint32 initial_ms = 1;
  uint32 max_ms = 2;
  double multiplier = 3;
  uint32 max_elapsed_ms = 4;  // 0 = unlimited
  bool jitter = 5;
}

message ObservationSink {
  string type = 1;              // "dnstap" (Phase 2)
  string export_id = 2;         // dnstap wire identity; defaults to name when empty
  repeated string destinations = 3;
  repeated string emit = 4;
  ObservationSinkFilters filters = 5;
  repeated string extra_fields = 6;  // pool, backend, ..., client, sink_name
  repeated string extra_tags = 7;    // tag key filter when "tags" in extra_fields; omit or "*" = all
  optional string name = 8;          // canonical operator/API id; defaults to export_id when empty
  optional ConnectRetry connect_retry = 9;
}

message RhaiConfig {
  uint64 max_operations = 1;
  uint32 max_call_depth = 2;
}

message Pool {
  string name = 1;
  repeated Backend backends = 2;
}

message Backend {
  string address = 1;           // "ip:port"
  optional uint32 weight = 2;   // load-balancing weight; default 100 when unset
}

message ControlConfig {
  string listen_address = 1;    // gRPC, e.g. "127.0.0.1:5199"
}
