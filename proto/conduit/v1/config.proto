syntax = "proto3";

package conduit.v1;

// Canonical configuration model. Every tunable field lives here.

message Config {
  uint32 schema_version = 1;  // must be 1 for Phase 0
  ListenersConfig listeners = 2;
  ForwardConfig forward = 3;
  OrchestratorConfig orchestrator = 4;
  EventsConfig events = 5;
  RhaiConfig rhai = 6;
  repeated Pool pools = 7;
  ControlConfig control = 8;
  RulesConfig rules = 9;
  LoggingConfig logging = 10;
  repeated DataSource data_sources = 11;
  optional MetricsConfig metrics = 12;
  optional TracingConfig tracing = 13;
  optional DataplaneConfig dataplane = 14;
  optional ShutdownConfig shutdown = 15;
  optional DataSourceLimits data_source_limits = 16;
  repeated CacheInstance caches = 17;
  optional LookupConfig lookup = 18;
  // Host-managed client IP ACL policy (optional; omit = admit-all).
  optional AclsConfig acls = 19;
}

// Client IP ACL policy: ordered first-match rules over named CIDR data sources.
message AclsConfig {
  string default_action = 1;  // "allow" | "deny" (deny fall-through = silent drop)
  repeated AclRule rules = 2;
}

message AclRule {
  string match = 1;            // name of a type:cidr data source
  string action = 2;           // "drop" | "refuse" | "tag" | "accept"
  optional string tag = 3;     // required when action is "tag"
}

// Process shutdown behavior: graceful drain of in-flight transactions before exit.
message ShutdownConfig {
  optional bool drain = 1;             // wait for in-flight transactions to finish before exit; default true
  optional uint32 drain_timeout_ms = 2; // max wait for the drain; default 5000; a second SIGINT/SIGTERM abandons the wait
}

// Phase 4: Prometheus scrape + OTEL push (design §7.1).
message MetricsConfig {
  bool enabled = 1;
  string profile = 2;              // "full" | "minimal" | "off"; default full when enabled
  optional PrometheusMetricsConfig prometheus = 3;
  optional OtelMetricsConfig otel = 4;
  repeated UserMetricExportConfig user_metrics = 5;  // per-metric export tier overrides
}

// Export tier for Rhai conduit_user_* metrics (default: full = full profile only).
message UserMetricExportConfig {
  string name = 1;    // metric name from metric_inc (without conduit_user_ prefix)
  string export = 2;  // "minimal" | "full"
}

message PrometheusMetricsConfig {
  string listen_address = 1;       // e.g. "127.0.0.1:9090"
  string path = 2;                 // default "/metrics"
}

message OtelMetricsConfig {
  string endpoint = 1;             // OTLP HTTP endpoint (http:// or https://)
  uint32 push_interval_ms = 2;
  map<string, string> resource_attributes = 3;
  bool allow_invalid_certs = 4;    // when true, accept invalid TLS server certs (https only)
  map<string, string> headers = 5; // optional OTLP HTTP headers (reserved for future auth)
}

// Phase 4: per-transaction pipeline trace (design §4.3); off by default.
message TracingConfig {
  bool enabled = 1;
  optional TracingActivation activation = 2;
  optional TracingOutput output = 3;
}

message TracingActivation {
  optional string tag = 1;
  repeated Selector selectors = 2;
  optional double sample_percent = 3;  // 0-100 deterministic sampling
  optional string sample_key = 4;    // static salt for sample_percent (optional)
  optional string sample_key_from = 5; // qname — dynamic salt for sample_percent
}

message TracingOutput {
  bool log_json = 1;
}

message DataSource {
  string name = 1;
  string type = 2;           // "csv" | "cidr"
  string path = 3;
  string key_column = 4;     // default: first column
  string value_column = 5;   // default: second column
  // Optional per-entry load-safety overrides; unset = inherit the global
  // data_source_limits block (which itself falls back to built-in defaults).
  optional uint64 max_file_bytes = 6;
  optional uint64 max_entries = 7;
  optional uint32 max_key_bytes = 8;
  optional uint32 max_value_bytes = 9;
}

// Generic load-safety limits for data_sources, applied at snapshot compile to
// bound memory use. Framed on the table/key->value abstraction so they apply to
// any source type (CSV today). 0 = use the built-in default for that field.
message DataSourceLimits {
  uint64 max_file_bytes = 1;   // per-table source file size cap
  uint64 max_entries = 2;      // per-table key->value entry cap
  uint32 max_key_bytes = 3;    // per-entry key length cap
  uint32 max_value_bytes = 4;  // per-entry value length cap
  uint32 max_tables = 5;       // number of data_sources entries
  uint64 max_total_bytes = 6;  // aggregate bytes across all tables in a snapshot
}

// Phase 1 dev/ops logging (not full transaction trace — see design §4.3).
message LoggingConfig {
  string level = 1;    // error | warn | info | debug | trace; default info
  string output = 2;   // stderr | stdout; default stderr
  optional QueryAccessLogging query_access = 3;
}

// Per-event levels for query-path access lines (ACL denials, etc.).
message QueryAccessLogging {
  // Level for ACL denial lines: "off" | "error" | "warn" | "info" | "debug" | "trace".
  // Empty / omit = off at default global info (no denial spam).
  string acl_denied = 1;
  optional AclDeniedSample acl_denied_sample = 2;
}

message AclDeniedSample {
  string mode = 1;             // "per_source" | "every_nth"
  optional double rate = 2;    // per_source: 0-100 percent of client IPs sampled
  optional uint32 nth = 3;     // every_nth: emit 1 of every N denials (per worker)
}

message RulesConfig {
  string match_mode = 1;   // "first_match" (phase 1)
  repeated Rule rules = 2;
}

message Rule {
  string name = 1;
  string hook = 2;           // "request" | "response"
  repeated Selector selectors = 3;
  repeated Action actions = 4;
}

message Selector {
  string type = 1;   // qname_suffix | qname_exact | qtype | rcode | tag | answer_source | cache_instance | sample_percent | every_nth_worker | every_nth_global | client_cidr
  string value = 2;
  optional string key = 3;       // sample_percent only: static salt (optional)
  optional string key_from = 4;  // sample_percent only: qname | rule_name | sink_name
}

message Action {
  string type = 1;   // set_pool | set_tag | clear_tag | set_retry_pool | retry | retry_now | clear_retry | clear_retry_pool | drop | set_rcode | rhai | set_source_v4 | set_source_v6 | set_retry_source_v4 | set_retry_source_v6 | clear_retry_source_v4 | clear_retry_source_v6
  string value = 2;
}

message ListenersConfig {
  uint32 threads = 1;           // min 1
  bool reuse_port = 2;
  uint32 rcvbuf = 3;
  uint32 sndbuf = 4;
  repeated Listener listeners = 5;
}

message Listener {
  string address = 1;           // e.g. "0.0.0.0:53"
  string protocol = 2;          // "udp" | "tcp"
  optional uint32 threads = 3;  // per-listener ingress worker override
  optional bool reuse_port = 4;
  optional string name = 5;     // stable metrics / log identity
  optional uint32 rcvbuf = 6;
  // When set, fully replaces top-level acls for this listener; omit = inherit.
  optional AclsConfig acls = 7;
}

// Pluggable dataplane execution model (selected at process startup).
message DataplaneConfig {
  string runtime = 1;           // "sync" | "split_io" | "tokio"
  uint32 policy_workers = 2;
  uint32 io_workers = 3;
  optional uint32 slot_chunk_size = 4;
}

message ForwardConfig {
  uint32 outstanding_per_backend = 1;
  uint32 timeout_ms = 2;
  repeated string sources_v4 = 3;
  string source_selection = 4;   // "round_robin" (slice A)
  repeated string sources_v6 = 5;
  string upstream_transport = 6; // "udp_only" | "tcp_only" | "prefer_udp_with_tcp_fallback"
  bool client_tcp_uses_upstream_tcp = 7;
}

message OrchestratorConfig {
  uint32 max_attempts = 1;
  uint32 max_txn_duration_ms = 2;
  uint32 txn_table_capacity = 3;
}

message EventsConfig {
  uint32 queue_depth = 1;
  string drop_policy = 2;       // "drop_oldest" | "drop_newest"
  repeated EventSink sinks = 3;
}

message EventSinkFilters {
  optional string tag_required = 1;
  repeated Selector selectors = 2;
  optional double sample_percent = 3;  // 0-100 deterministic sampling
  optional string pool = 4;
  optional string backend = 5;
  optional string sample_key = 6;    // static salt for sample_percent (optional)
  optional string sample_key_from = 7; // qname | sink_name — dynamic salt for sample_percent
}

message ConnectRetry {
  uint32 initial_ms = 1;
  uint32 max_ms = 2;
  double multiplier = 3;
  uint32 max_elapsed_ms = 4;  // 0 = unlimited
  bool jitter = 5;
}

message EventSink {
  string type = 1;              // "dnstap" (Phase 2)
  string export_id = 2;         // dnstap wire identity; defaults to name when empty
  repeated string destinations = 3;
  repeated string emit = 4;
  EventSinkFilters filters = 5;
  repeated string extra_fields = 6;  // pool, backend, ..., client, sink_name
  repeated string extra_tags = 7;    // tag key filter when "tags" in extra_fields; omit or "*" = all
  optional string name = 8;          // canonical operator/API id; defaults to export_id when empty
  optional ConnectRetry connect_retry = 9;
}

message RhaiConfig {
  uint64 max_operations = 1;
  uint32 max_call_depth = 2;
  uint32 hook_timeout_ms = 3;  // per-hook wall time; 0 = default 50ms
}

message Pool {
  string name = 1;
  repeated Backend backends = 2;
  repeated string sources_v4 = 3;
  repeated string sources_v6 = 4;
  optional uint32 max_inflight = 5;
  optional HealthCheck health = 6;  // active backend health probing; absent = disabled (today's behavior)
}

// Pool-level active health-probe configuration (phase 1c). Absent or
// enabled=false means no probes and every backend stays eligible.
message HealthCheck {
  bool enabled = 1;
  optional uint32 interval_ms = 2;       // probe period; default 1000, floor 100
  optional uint32 timeout_ms = 3;        // per-probe timeout; default = interval
  optional uint32 rise = 4;              // consecutive successes to mark up; default 3, min 1
  optional uint32 fall = 5;              // consecutive failures to mark down; default 2, min 1
  optional string probe_qname = 6;       // pool-level probe query name template
  optional string probe_qtype = 7;       // pool-level probe query type (IANA name or TYPEn)
  repeated string acceptable_rcodes = 8; // empty = accept any well-formed response as alive
  optional string initial_state = 9;     // "optimistic" (default) | "require_1_good" | "require_full_rise"
  optional bool latency_weighting = 10;  // scale effective weight by latency EWMA (routing, later phase)
  optional uint32 min_eligible = 11;     // fail-open floor; min eligible before Route fails open (later phase)
  optional bool passive_fast_trip = 12;  // count live forward failures toward health; default true (later phase)
  optional uint32 passive_fall = 13;     // consecutive passive failures to open; default 2, min 1 (later phase)
}

message Backend {
  string address = 1;           // "ip:port"
  optional uint32 weight = 2;   // load-balancing weight; default 100 when unset
  optional string name = 3;     // unique per pool when set
  optional string probe_qname = 4;   // per-backend probe qname override (else pool template)
  optional string probe_qtype = 5;   // per-backend probe qtype override (else pool template)
  optional string probe_source = 6;  // per-backend probe egress source IP
  // Reserved/forward-compatible only (design §D6): a per-backend transport that
  // diverges from forward.upstream_transport is NOT honored — probes always use
  // the forward upstream transport. Defined now so later divergence is additive.
  optional string transport = 7;
}

message ControlTlsConfig {
  string cert_path = 1;
  string key_path = 2;
  string client_ca_path = 3;   // when set, require client certificates (mTLS)
}

message ControlConfig {
  string listen_address = 1;    // gRPC, e.g. "127.0.0.1:5199"
  bool reflection_enabled = 2;  // expose gRPC reflection service (dev/test convenience)
  repeated string api_keys = 3; // when non-empty, require matching key on control RPCs
  ControlTlsConfig tls = 4;     // when set, serve gRPC over TLS (optional mTLS)
}

// Pluggable lookup profiles and named cache instances (pluggable-lookup-system).
message LookupConfig {
  map<string, LookupProfile> profiles = 1;
}

message LookupProfile {
  repeated LookupProvider providers = 1;
}

message LookupProvider {
  string type = 1;              // "cache" | "forward"
  optional string cache = 2;    // cache instance name when type is cache
}

message CacheInstance {
  string name = 1;
  string type = 2;              // "memory" (v1) | "lmdb" | "ebpf_map" (reserved)
  optional CacheNegativeConfig negative_cache = 3;
  optional CacheOnHitConfig on_hit = 4;
  reserved 5, 6;
  reserved "cache_truncated_udp", "truncated_udp_ttl_secs";
  optional bool rotate_rrset_on_serve = 7;
  optional CacheMemoryConfig memory = 8;
  optional CacheKeyConfig key = 9;  // reserved: key augmenters
  optional uint64 max_entries = 10;
  optional CacheTruncatedUdpConfig truncated_udp = 11;
}

// Opt-in TC=1 UDP answer caching (separate transport key and ttl_secs override).
message CacheTruncatedUdpConfig {
  optional bool enabled = 1;        // default false
  optional uint32 ttl_secs = 2;     // required and > 0 when enabled
}

message CacheNegativeConfig {
  optional bool enabled = 1;
  optional bool nxdomain_covers_descendants = 2;  // default true (RFC 8020)
  optional uint32 servfail_ttl_secs = 3;        // default 10; 0 = do not cache SERVFAIL
}

message CacheOnHitConfig {
  string response_rules = 1;      // "run" (default) | "skip"
}

message CacheMemoryConfig {
  optional uint32 shard_count = 1;
  optional string eviction = 2;   // "passive" (default) | "active"
}

// Reserved for future cache key augmenters (CIDR, Rhai scripts).
message CacheKeyConfig {
  optional CacheKeyAugmentConfig augment = 1;
}

message CacheKeyAugmentConfig {
  // Placeholder — augmenters deferred to backlog.
}
