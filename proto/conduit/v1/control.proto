syntax = "proto3";

package conduit.v1;

import "conduit/v1/config.proto";

service ConduitControl {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
  rpc ExportConfig(ExportConfigRequest) returns (ExportConfigResponse);
  rpc ReloadFromFile(ReloadFromFileRequest) returns (ReloadFromFileResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  // Read-only ACL dry-run against the live runtime snapshot (no metrics/logs).
  rpc CheckAcl(CheckAclRequest) returns (CheckAclResponse);
}

message GetConfigRequest {}
message GetConfigResponse {
  Config effective = 1;
}

message ValidateConfigRequest {
  Config config = 1;
}
message ValidateConfigResponse {
  bool ok = 1;
  repeated string errors = 2;
}

enum OverlayApplyMode {
  OVERLAY_APPLY_MODE_UNSPECIFIED = 0;  // treated as MERGE
  OVERLAY_APPLY_MODE_MERGE = 1;
  OVERLAY_APPLY_MODE_REPLACE = 2;
  OVERLAY_APPLY_MODE_CLEAR = 3;
}

message ApplyConfigRequest {
  Config overlay = 1;           // patch fields (required for MERGE/REPLACE unless REPLACE with empty patch)
  OverlayApplyMode mode = 2;
}
message ApplyConfigResponse {
  bool ok = 1;
  repeated string errors = 2;
}

message ExportConfigRequest {
  string format = 1;            // "yaml" | "json"
}
message ExportConfigResponse {
  string body = 1;
}

message ReloadFromFileRequest {}
message ReloadFromFileResponse {
  bool ok = 1;
  repeated string errors = 2;
}

message HealthRequest {}
message HealthResponse {
  string status = 1;            // "serving"
}

message GetTraceRequest {
  string txn_id = 1;            // transaction id as decimal string
}

message TraceEvent {
  string phase = 1;
  uint64 elapsed_us = 2;
  optional string message = 3;
  optional string pool = 4;
  optional string backend = 5;
}

message GetTraceResponse {
  bool found = 1;
  repeated TraceEvent events = 2;
}

message CheckAclRequest {
  string ip = 1;                 // client IP to evaluate (IPv4 or IPv6)
  optional string listener = 2;  // filter by listener name; omit = all listeners
}

// One listener's effective ACL outcome for CheckAcl / conduitctl acl check.
message AclCheckResult {
  string listener = 1;
  string decision = 2;           // admit | drop | refuse | tag
  optional string tag = 3;       // set when decision is tag
  string matched = 4;            // cidr view name, or "default"
  string action = 5;             // matched rule action, or default_action (allow|deny)
}

message CheckAclResponse {
  string ip = 1;
  repeated AclCheckResult results = 2;
}
