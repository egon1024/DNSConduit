schema_version: 1
id: fixture-auth-nodata-mx
suites: [full]
intent: |
  ## Purpose

  For an existing name that has no MX, authoritative peers return **NODATA**
  (NOERROR with an empty answer). Through Conduit, clients should see that same
  empty successful answer — Conduit does not invent MX or change the rcode.

  ## How it works

  1. The peer loads fixture zone `example.test` (`www` has A/AAAA, no MX).
  2. A client asks Conduit for `www.example.test` MX.
  3. The reply must be NODATA and match a direct query to the peer.

  ## Outcomes

  | Outcome | Meaning for operators |
  |---|---|
  | <span class="interop-outcome interop-outcome--pass">pass</span> | Through Conduit, MX on `www` is NODATA, matching the peer. |
  | <span class="interop-outcome interop-outcome--fail">fail</span> | Unexpected rcode or answers, or Conduit disagreed with the peer. |
  | <span class="interop-outcome interop-outcome--skip">skip</span> | Peer is not authoritative for this matrix (or profile out of scope). |
  | <span class="interop-outcome interop-outcome--characterized">characterized</span> | Not used for this case today. If it appeared, it would mean a documented peer-specific quirk rather than a Conduit regression. |
applicability:
  roles: [auth]
  profiles: [forward-only]
peer_setup:
  fixtures: [example.test]
queries:
  - qname: www.example.test
    qtype: MX
oracles:
  - kind: property
    checks: [nodata]
  - kind: parity
    compare: [rcode, ancount]
