schema_version: 1
id: forward-parity-smoke
suites: [smoke, full]
intent: |
  ## Purpose

  On the **forward-only** profile, a simple **A** query through Conduit must
  return **NOERROR** with at least one answer. This is a quick forward happy-path
  check; it does **not** require the answer to match a side-by-side direct query
  to the peer (that stronger check is a different case).

  ## How it works

  1. The peer is configured with a local smoke name (`www.smoke.test` →
     `192.0.2.20`) so the answer does not depend on the public Internet.
  2. A client queries Conduit; Conduit forwards to the peer.
  3. The reply must be NOERROR with at least one answer record.

  ## Outcomes

  | Outcome | Meaning for operators |
  |---|---|
  | <span class="interop-outcome interop-outcome--pass">pass</span> | Conduit returned NOERROR with an answer for the smoke A query. |
  | <span class="interop-outcome interop-outcome--fail">fail</span> | No successful answer through Conduit — investigate forwarding, peer readiness, or a peer change that broke the smoke name. |
  | <span class="interop-outcome interop-outcome--skip">skip</span> | This peer/profile combination is out of scope for the case. |
  | <span class="interop-outcome interop-outcome--characterized">characterized</span> | Not used for this case today. If it appeared, it would mean a documented peer-specific quirk rather than a Conduit regression. |
applicability:
  roles: [stub, auth, recursive]
  profiles: [forward-only]
peer_setup:
  local_rr:
    - name: www.smoke.test.
      type: A
      rdata: "192.0.2.20"
      ttl: 300
oracles:
  - kind: property
    checks: [rcode-noerror, has-answer]
