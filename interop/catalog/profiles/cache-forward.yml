schema_version: 1
# Cache → forward lookup profile (graduated cache fast-path cold miss).
listeners:
  threads: 1
  reuse_port: false
  listeners:
    - address: "0.0.0.0:5353"
      protocol: udp
    - address: "0.0.0.0:5353"
      protocol: tcp
forward:
  outstanding_per_backend: 50
  timeout_ms: 2000
orchestrator:
  max_attempts: 3
  max_txn_duration_ms: 5000
  txn_table_capacity: 1024
events:
  queue_depth: 4096
  drop_policy: drop_oldest
rhai:
  max_operations: 10000
  max_call_depth: 32
pools:
  - name: default
    backends:
      - address: "172.30.97.10:53"
        weight: 100
caches:
  - name: global
    type: memory
    max_entries: 10000
    negative_cache:
      enabled: true
      nxdomain_covers_descendants: true
      servfail_ttl_secs: 10
lookup:
  profiles:
    default:
      providers:
        - type: cache
          cache: global
        - type: forward
rules:
  match_mode: first_match
  rules:
    - name: default-pool
      hook: request
      selectors: []
      actions:
        - type: set_pool
          value: default
logging:
  level: warn
metrics:
  enabled: true
  profile: minimal
  prometheus:
    listen_address: "0.0.0.0:9090"
    path: /metrics
