# bind-recursive family — named.conf (+ zone files) is rendered by prepare.py
# from peer_setup local_rr as master zones; recursion is enabled with empty
# forward-only forwarders so contract names stay local (no public recursion).
services:
  peer:
    volumes:
      - ${PEER_CONFIG_DIR}:/peer-config:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        exec named -g -u bind -c /peer-config/named.conf
    ports:
      - "${PEER_HOST_PORT}:53/udp"
      - "${PEER_HOST_PORT}:53/tcp"
