# Operator documentation — MkDocs Material (preview: make docs-serve).
site_name: DNS Conduit
site_description: Operator documentation for DNS Conduit
site_url: https://egon1024.github.io/DNSConduit/

repo_url: https://github.com/egon1024/DNSConduit
repo_name: egon1024/DNSConduit

docs_dir: docs
strict: true

# Docs-root paths like /glossary/index.md#backend are validated and rewritten to
# relative URLs in output (works under mike version dirs on GitHub Pages).
validation:
  links:
    absolute_links: relative_to_docs

hooks:
  - hooks.py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - content.code.copy

# Docs product version: hooks.py sets extra.version.default; doc-version.js shows it in the header.
# extra_css / extra_javascript paths must live under docs_dir (MkDocs copies from there).
# The repo card “latest release” badge is hidden in docs/assets/stylesheets/version-label.css.

extra:
  version:
    default: development

extra_css:
  - assets/stylesheets/version-label.css
  - assets/stylesheets/column-no-wrap.css

extra_javascript:
  - assets/javascripts/doc-version.js

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Install and run: getting-started/install-and-run.md
      - Minimal configuration: getting-started/minimal-configuration.md
      - First query: getting-started/first-query.md
  - Concepts:
      - Overview: concepts/index.md
      - Architecture and packet path: concepts/architecture-and-packet-path.md
      - Planned plugin models: concepts/planned-plugin-models.md
  - Policy & routing:
      - Overview: policy-routing/index.md
      - Rules and actions: policy-routing/rules-and-actions.md
      - Pools and backends: policy-routing/pools-and-backends.md
      - Retries and transactions: policy-routing/retries-and-transactions.md
  - Control plane:
      - Overview: control-plane/index.md
      - Configuration model: control-plane/configuration-model.md
      - Config file: control-plane/config-file.md
      - Reload and export: control-plane/reload-and-export.md
      - gRPC and conduitctl: control-plane/grpc-and-conduitctl.md
  - Rhai:
      - Overview: rhai/index.md
      - Hooks and phases: rhai/hooks-and-phases.md
      - Transaction API: rhai/transaction-api.md
      - Data sources and lookups: rhai/data-sources-and-lookups.md
      - User metrics: rhai/user-metrics.md
      - Sandbox limits: rhai/sandbox-limits.md
  - Observability:
      - Overview: observability/index.md
      - Metrics: observability/metrics.md
      - Built-in metrics: observability/built-in-metrics.md
      - Tracing: observability/tracing.md
      - Event export: observability/event-export.md
      - Logging: observability/logging.md
  - Guides:
      - Overview: guides/index.md
      - Dual-stack forwarding: guides/dual-stack-forwarding.md
      - Control plane workflows: guides/control-plane-workflows.md
      - Metrics and tracing: guides/metrics-and-tracing.md
      - Event export and dnstap: guides/event-export-dnstap.md
      - Operator metrics profiles: guides/operator-metrics-profiles.md
  - Security:
      - Overview: security/index.md
      - API keys: security/api-keys.md
      - mTLS: security/mtls.md
  - Troubleshooting: troubleshooting/index.md
  - Glossary: glossary/index.md
  - Reference:
      - Overview: reference/index.md
      - Config schema:
          - Overview: reference/config-schema/index.md
          - Listeners: reference/config-schema/listeners.md
          - Pools: reference/config-schema/pools.md
          - Rules: reference/config-schema/rules.md
          - Control: reference/config-schema/control.md
          - Events: reference/config-schema/events.md
          - Metrics and tracing: reference/config-schema/metrics-and-tracing.md
      - gRPC and CLI: reference/grpc-and-cli.md
  - Versions: versions.md
  - License: license.md
