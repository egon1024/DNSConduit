# Operator documentation — MkDocs Material (preview: make docs-serve).
site_name: DNS Conduit
site_description: Operator documentation for DNS Conduit
site_url: https://egon1024.github.io/DNSConduit/

repo_url: https://github.com/egon1024/DNSConduit
repo_name: egon1024/DNSConduit

docs_dir: docs
strict: true

# Docs-root paths like /glossary/index.md#backend are validated and rewritten to
# relative URLs in output (works under mike version dirs on GitHub Pages).
validation:
  links:
    absolute_links: relative_to_docs

hooks:
  - hooks.py

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - content.code.copy

# Docs product version: hooks.py sets extra.version.default; doc-version.js shows it in the header.
# extra_css / extra_javascript paths must live under docs_dir (MkDocs copies from there).
# The repo card “latest release” badge is hidden in docs/assets/stylesheets/version-label.css.

extra:
  version:
    default: development

extra_css:
  - assets/stylesheets/version-label.css
  - assets/stylesheets/column-no-wrap.css
  - assets/stylesheets/txn-api.css
  - assets/stylesheets/toc-collapse.css
  - assets/stylesheets/interop-outcomes.css

extra_javascript:
  - assets/javascripts/doc-version.js
  - assets/javascripts/toc-collapse.js
  - assets/javascripts/txn-api-cards.js

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - What Conduit is for: getting-started/what-conduit-is-for.md
